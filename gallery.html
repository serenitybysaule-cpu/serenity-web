<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie | Serenity by Saule</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }

        .gallery-item {
            background-color: var(--color-nude);
            height: 350px;
            overflow: hidden;
            position: relative;
        }

        .gallery-item:nth-child(even) {
            height: 450px;
            /* Masonry effect dummy */
            background-color: var(--color-champagne);
        }

        .video-stories {
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            padding: 2rem 0;
        }

        .story-card {
            min-width: 200px;
            height: 350px;
            background-color: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Serenity</a>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="brand.html">La Marque</a></li>
            <li><a href="product.html">Le Produit</a></li>
            <li><a href="gallery.html" class="active">Galerie</a></li>
            <li><a href="measurement.html" class="cta-link">Sur Mesure</a></li>
        </ul>
        <div class="mobile-menu-toggle">☰</div>
    </nav>

    <header class="section" style="padding-top: 15vh; text-align: center;">
        <div class="container">
            <h1 class="fade-in">Moments de vie</h1>
        </div>
    </header>

    <section class="section">
        <div class="container">
            <h2>Stories</h2>
            <div class="video-stories">
                <!-- Exemple : Déposez vos vidéos dans assets/videos/ et nommez-les story-1.mp4, etc. -->
                <div class="story-card">
                    <video controls src="assets/videos/story-1.mp4"
                        style="width: 100%; height: 100%; object-fit: cover;"></video>
                </div>
                <div class="story-card">
                    <video controls src="assets/videos/story-2.mp4"
                        style="width: 100%; height: 100%; object-fit: cover;"></video>
                </div>
                <div class="story-card">
                    <video controls src="assets/videos/story-3.mp4"
                        style="width: 100%; height: 100%; object-fit: cover;"></video>
                </div>
            </div>

            <h2 style="margin-top: 3rem;">Portfolio</h2>
            <div class="gallery-grid">
                <!-- Exemple : Déposez vos photos dans assets/images/ et nommez-les gallery-1.jpg, gallery-2.jpg, etc. -->
                <img src="assets/images/gallery-1.jpg" alt="Description photo 1" class="gallery-item"
                    style="object-fit: cover; width: 100%;">
                <img src="assets/images/gallery-2.jpg" alt="Description photo 2" class="gallery-item"
                    style="object-fit: cover; width: 100%;">
                <img src="assets/images/gallery-3.jpg" alt="Description photo 3" class="gallery-item"
                    style="object-fit: cover; width: 100%;">
                <img src="assets/images/gallery-4.jpg" alt="Description photo 4" class="gallery-item"
                    style="object-fit: cover; width: 100%;">
                <img src="assets/images/gallery-5.jpg" alt="Description photo 5" class="gallery-item"
                    style="object-fit: cover; width: 100%;">
                <img src="assets/images/gallery-6.jpg" alt="Description photo 6" class="gallery-item"
                    style="object-fit: cover; width: 100%;">
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-col">
                <h4>Serenity by Saule</h4>
                <p>Lingerie sur-mesure haut de gamme.</p>
            </div>
            <div class="footer-col">
                <h4>Liens</h4>
                <a href="brand.html">La Marque</a>
            </div>
            <div class="footer-col">
                <h4>Newsletter</h4>
                <p>Restez informée.</p>
            </div>
        </div>
        <div class="footer-bottom">&copy; 2026 Serenity by Saule.</div>
    </footer>

    <script src="assets/js/main.js"></script>
</body>

</html>
